# Platform-facing product defaults. Keep branding here rather than duplicating
# it across init scripts, hostapd configuration, and captive-portal markup.
MICROFX_PRODUCT_NAME=${MICROFX_PRODUCT_NAME:-microFX}
MICROFX_PRODUCT_SLUG=${MICROFX_PRODUCT_SLUG:-microfx}
MICROFX_DEFAULT_PEER_ID=${MICROFX_DEFAULT_PEER_ID:-microfx-demo}
MICROFX_SETUP_SSID=${MICROFX_SETUP_SSID:-microFX-setup}
MICROFX_SETUP_PASSWORD=${MICROFX_SETUP_PASSWORD:-microfxsetup}

# Normal runtime roles use the kernel's interface names and remain configurable
# in one place. Development recovery does not assume this order: it tries both
# detected AR6003 interfaces against the stored WPA configuration.
MICROFX_PROVISION_INTERFACE=${MICROFX_PROVISION_INTERFACE:-wlan0}
MICROFX_WIFI_INTERFACE=${MICROFX_WIFI_INTERFACE:-wlan1}
