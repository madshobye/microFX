interface=@PROVISION_INTERFACE@
bind-interfaces
dhcp-range=10.42.0.20,10.42.0.100,255.255.255.0,12h
dhcp-option=3,10.42.0.1
dhcp-option=6,10.42.0.1
# RFC 8910 captive-portal URI. Older clients still discover the portal through
# wildcard DNS and their normal connectivity-check request.
dhcp-option=114,http://10.42.0.1/
address=/#/10.42.0.1
no-resolv
log-facility=-
