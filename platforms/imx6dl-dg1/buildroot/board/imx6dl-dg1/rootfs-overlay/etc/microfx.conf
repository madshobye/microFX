# Renderer defaults. Output size 0 means automatic global HDMI modes.
# Set both dimensions to force one mode, e.g. 1280x720, and disable automation.
MICROFX_OUTPUT_WIDTH=0
MICROFX_OUTPUT_HEIGHT=0
MICROFX_PIXEL_DENSITY=auto
MICROFX_MIN_PIXEL_DENSITY=0.50
MICROFX_TARGET_FPS=30

# Development images use the stored-network client and SSH path only. Enable
# this explicitly when the setup network has completed hardware validation.
MICROFX_PROVISIONING=0
# Automatic-density hysteresis. The renderer samples averaged frame cost,
# lowers quickly under load, and raises only after sustained spare capacity.
MICROFX_DENSITY_SAMPLE_FRAMES=60
MICROFX_DENSITY_STEP=0.1
MICROFX_DENSITY_DOWN_THRESHOLD=1.08
MICROFX_DENSITY_UP_THRESHOLD=0.72
MICROFX_DENSITY_UP_SAMPLES=4

# Refresh network-backed demo data only while that project is active. Results
# are kept in /run so normal operation does not generate SD-card writes.
MICROFX_DATA_ADAPTERS=1
MICROFX_DATA_LOOP_SECONDS=15
MICROFX_DATA_RETRY_SECONDS=30
MICROFX_DATA_MAX_BYTES=262144
MICROFX_DATA_MIN_EPOCH=1609459200
MICROFX_FLIGHT_REFRESH_SECONDS=300
MICROFX_ENERGY_REFRESH_SECONDS=3600
