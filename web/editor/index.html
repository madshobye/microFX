<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Graphics Studio</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.39.1/src-min-noconflict/ace.js"></script>
</head>
<body>
  <header>
    <div>
      <h1 id="product-title">Graphics Studio</h1>
      <p>JavaScript graphics editor</p>
    </div>
    <div class="connection">
      <label>Device ID <input id="peer-id" spellcheck="false"></label>
      <button id="connect">Connect</button>
      <span id="status" data-state="idle">offline</span>
    </div>
  </header>

  <main>
    <section class="code-panel">
      <div class="toolbar">
        <strong>main.js</strong>
        <span class="spacer"></span>
        <button id="retrieve" disabled>Retrieve</button>
        <button id="save" disabled>Save</button>
        <button id="run" class="primary" disabled>Save &amp; Run</button>
      </div>
      <div id="editor"></div>
    </section>

    <aside>
      <div class="aside-title">
        <div><strong>Assets</strong><small>/assets</small></div>
        <label class="upload">Upload<input id="asset-input" type="file" multiple disabled></label>
      </div>
      <ul id="assets"><li class="empty">Connect to retrieve project</li></ul>
      <div class="help">
        <strong>Flow</strong>
        <p>Edits are written atomically. “Save &amp; Run” asks the platform adapter to reload the active script.</p>
        <p><kbd>⌘</kbd><kbd>S</kbd> saves, <kbd>⌘</kbd><kbd>↵</kbd> saves and runs.</p>
      </div>
    </aside>
  </main>

  <footer><span id="message">Ready</span><span>PeerJS DataChannel · libpeer device</span></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
