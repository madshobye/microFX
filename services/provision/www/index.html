<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>@PRODUCT_NAME@ setup</title><style>
body{font:16px system-ui;background:#080c1d;color:#e8f5ff;max-width:34rem;margin:3rem auto;padding:1rem}
h1{color:#ffdc64}form{display:grid;gap:.8rem;background:#111a34;padding:1.5rem;border:1px solid #55dfff}
input,button{font:inherit;padding:.75rem;border-radius:.3rem;border:1px solid #527;background:#080c1d;color:white}
button{background:#19a8cc;border:0;font-weight:700}.note{color:#9bc1d8;font-size:.9rem}
</style></head><body><h1>@PRODUCT_NAME@ setup</h1>
<p>Add a Wi-Fi network and choose the device peer ID. The setup network stays available so more networks can be added.</p>
<form method="post" action="/cgi-bin/save">
<label>Wi-Fi SSID<input name="ssid" maxlength="32" required></label>
<label>Wi-Fi password<input name="password" type="password" minlength="8" maxlength="63" required></label>
<label>Peer ID<input name="peer_id" maxlength="64" value="microfx-demo" pattern="[A-Za-z0-9._-]+" required></label>
<button type="submit">Save and connect</button></form>
<p class="note">Setup AP: @SETUP_SSID@ · password: @SETUP_PASSWORD@ · local address: 10.42.0.1</p>
</body></html>
